<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVP & RoboWM Physical Plausibility Review</title>
<style>
:root {
  --bg:#f5f7fa; --card:#fff; --text:#18202a; --muted:#667085; --border:#e2e7ee;
  --error:#b42318; --error-bg:#fee4e2; --clean:#027a48; --clean-bg:#d1fadf;
  --uncertain:#b54708; --uncertain-bg:#fef0c7; --blue:#175cd3; --blue-bg:#eff8ff;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
header { background:#101828; color:#fff; padding:34px max(28px,calc((100vw - 1500px)/2)); }
header h1 { margin:0 0 8px; font-size:28px; }
header p { margin:0; color:#cbd5e1; }
.header-actions { margin-top:18px; }
.header-actions a {
  display:inline-block; color:#fff; border:1px solid #475467; padding:8px 13px;
  border-radius:8px; text-decoration:none; font-size:14px;
}
main { max-width:1500px; margin:auto; padding:28px; }
.stats {
  display:grid; grid-template-columns:repeat(4,minmax(160px,1fr));
  gap:14px; margin-bottom:22px;
}
.stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
.stat .number { font-size:28px; font-weight:700; }
.stat .label { margin-top:3px; color:var(--muted); font-size:13px; }
.toolbar { background:#fff; border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:20px; }
.tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:13px; }
button {
  border:1px solid var(--border); background:#fff; border-radius:8px;
  padding:8px 13px; cursor:pointer; font-size:14px;
}
button.active { background:#101828; border-color:#101828; color:#fff; }
.filters { display:grid; grid-template-columns:1fr 180px 240px 180px; gap:10px; }
input,select {
  border:1px solid #d0d5dd; border-radius:8px; padding:9px 11px;
  font-size:14px; background:#fff;
}
.results-title { display:flex; justify-content:space-between; align-items:center; margin:22px 0 12px; }
.results-title h2 { margin:0; font-size:20px; }
#resultCount { color:var(--muted); font-size:14px; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(330px,1fr)); gap:18px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:13px; overflow:hidden; }
.video-wrap { background:#000; aspect-ratio:16/9; }
video { display:block; width:100%; height:100%; object-fit:contain; }
.content { padding:15px; }
.card-title { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:5px; }
.video-id { font-weight:700; font-size:16px; }
.task { color:var(--muted); font-size:13px; word-break:break-word; margin-bottom:12px; }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.badge { padding:4px 7px; border-radius:6px; font-size:11px; font-weight:600; background:#f2f4f7; color:#344054; }
.badge.error { color:var(--error); background:var(--error-bg); }
.badge.clean { color:var(--clean); background:var(--clean-bg); }
.badge.uncertain { color:var(--uncertain); background:var(--uncertain-bg); }
.badge.dataset { color:var(--blue); background:var(--blue-bg); }
.meta { display:grid; grid-template-columns:135px 1fr; gap:5px 8px; font-size:13px; margin:10px 0; }
.meta .key { color:var(--muted); }
.description {
  margin-top:12px; background:#f9fafb; border-left:3px solid #98a2b3;
  padding:10px; font-size:13px; line-height:1.45;
}
details { margin-top:10px; border-top:1px solid #eaecf0; padding-top:9px; }
summary { cursor:pointer; font-size:13px; font-weight:600; }
.details-text { font-size:13px; line-height:1.5; margin-top:8px; color:#475467; }
.empty {
  background:#fff; border:1px solid var(--border); border-radius:12px;
  padding:35px; text-align:center; color:var(--muted);
}
@media (max-width:1100px) {
  .grid { grid-template-columns:repeat(2,minmax(300px,1fr)); }
  .filters { grid-template-columns:1fr 1fr; }
}
@media (max-width:700px) {
  .stats { grid-template-columns:1fr 1fr; }
  .grid { grid-template-columns:1fr; }
  .filters { grid-template-columns:1fr; }
  main { padding:15px; }
}
</style>
</head>
<body>
<header>
  <h1>LVP & RoboWM Physical Plausibility Review</h1>
  <p>Manual review of generated manipulation videos with task, physical-error, severity, and execution-impact annotations.</p>
  <div class="header-actions"><a href="annotations.xlsx">Download annotation spreadsheet</a></div>
</header>

<main>
<div class="stats">
  <div class="stat"><div class="number" id="totalStat"></div><div class="label">Total videos</div></div>
  <div class="stat"><div class="number" id="errorStat"></div><div class="label">Clear error cases</div></div>
  <div class="stat"><div class="number" id="cleanStat"></div><div class="label">No obvious error</div></div>
  <div class="stat"><div class="number" id="uncertainStat"></div><div class="label">Unclear / data issue</div></div>
</div>

<div class="toolbar">
  <div class="tabs">
    <button data-group="error" class="active">Errors</button>
    <button data-group="clean">No obvious error</button>
    <button data-group="uncertain">Unclear / Data issue</button>
    <button data-group="all">All videos</button>
  </div>

  <div class="filters">
    <input id="search" type="search" placeholder="Search video ID, task, or description...">
    <select id="dataset">
      <option value="all">All datasets</option>
      <option value="LVP">LVP</option>
      <option value="RoboWM">RoboWM</option>
    </select>
    <select id="errorType"><option value="all">All error types</option></select>
    <select id="severity">
      <option value="all">All severities</option>
      <option value="0 - None">0 - None</option>
      <option value="1 - Minor">1 - Minor</option>
      <option value="2 - Moderate">2 - Moderate</option>
      <option value="3 - Severe">3 - Severe</option>
    </select>
  </div>
</div>

<div class="results-title">
  <h2 id="sectionTitle">Error Cases</h2>
  <span id="resultCount"></span>
</div>

<div id="grid" class="grid"></div>
</main>

<script>
const DATA = [{"dataset": "LVP", "video_id": "LVP_000", "task": "grab_the_plunger", "prompt": "A person's left arm reaches down toward the black plunger in its holder on the hexagonal-tiled floor next to the toilet.", "task_outcome": "Partial success", "main_error": "Geometry / structure error", "secondary_error": "None", "severity": "2 - Moderate", "affects_execution": "Yes", "description": "The plunger suddenly breaks into pieces, and its geometric structure deforms.", "note": "", "video": "videos/lvp/0000.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_001", "task": "put the fork into the red cup", "prompt": "A hand holding a silver fork moves it from over the black mug and places it into the red cup decorated with a dog pattern.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0001.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_002", "task": "lift_pan_lid", "prompt": "A right hand in a grey sleeve reaches to lift the stainless steel pan lid from the black electric stovetop.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0002.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_003", "task": "grab_the_weight", "prompt": "A person's left hand reaches to grab the top black, octagonal 'Iron Grip' weight plate from a stack on a yellow Hammer Strength machine.", "task_outcome": "Failure", "main_error": "Task / goal error", "secondary_error": "Geometry / structure error", "severity": "2 - Moderate", "affects_execution": "Yes", "description": "The hand does not grab the weight; instead, it grabs the stick and fails to execute the task. There is also a penetration error related to object depth/distance.", "note": "Incomplete task, likely due to a geometry/depth issue (failure to estimate distance).", "video": "videos/lvp/0003.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_004", "task": "turn_knob_of_washing_machine", "prompt": "A person's left hand, wearing a grey sweatshirt, turns the large silver control knob on the front of a grey LG washing machine.", "task_outcome": "Failure", "main_error": "Task / goal error", "secondary_error": "None", "severity": "2 - Moderate", "affects_execution": "Yes", "description": "The video is static; nothing moves. The hand tries to approach but stops halfway and does not reach the button.", "note": "", "video": "videos/lvp/0004.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_005", "task": "move_pink_mouse_closer_0", "prompt": "A hand moves the pink mouse on the white desk closer to the foreground.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0005.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_006", "task": "take_out_the_chair", "prompt": "A hand reaches into a grey, felt-lined nook and pulls a three-legged wooden stool out from the corner.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0006.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_007", "task": "grab_chair_0", "prompt": "A right hand reaches to grab the wooden chair with a cross-back design on the red brick patio.", "task_outcome": "Failure", "main_error": "Geometry / structure error", "secondary_error": "Task / goal error", "severity": "2 - Moderate", "affects_execution": "Yes", "description": "The hand does not reach the chair. There is also a penetration/depth error related to object distance.", "note": "Incomplete task, likely due to a geometry/depth issue (failure to estimate distance).", "video": "videos/lvp/0007.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_008", "task": "Stir the tomatoes in the pot", "prompt": "A metal ladle stirs chopped tomatoes simmering in a steaming stainless steel pot on a white electric stovetop.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Good, except that the stirring motion is not very effective.", "note": "", "video": "videos/lvp/0008.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_009", "task": "close_dishwasher", "prompt": "A person's right hand lifts the open, downward-facing dishwasher door to close it.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0009.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_010", "task": "Use the pen to press the button F", "prompt": "A right hand uses a blue pen to press the 'F' key on the black keyboard of a laptop.", "task_outcome": "Partial success", "main_error": "Task / goal error", "secondary_error": "None", "severity": "1 - Minor", "affects_execution": "Possibly", "description": "The key is pressed and the action is good, except that the wrong key is chosen.", "note": "", "video": "videos/lvp/0010.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_011", "task": "flip_cup_upside_down", "prompt": "The left hand reaches for the green paper cup resting on the black leather couch and flips it upside down.", "task_outcome": "Success", "main_error": "Geometry / structure error", "secondary_error": "None", "severity": "1 - Minor", "affects_execution": "No", "description": "The hand is deformed, and the flipped cup's landing looks unstable.", "note": "", "video": "videos/lvp/0011.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_012", "task": "punching_the_glass", "prompt": "From a first-person perspective, a right hand clenched into a fist moves to punch a glass safety railing overlooking a lower floor with a polished terrazzo surface.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0012.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_013", "task": "pressing_the_button_to_flush_the_toilet", "prompt": "From an overhead view, a person's right hand reaches over the open lid of a white toilet to press the smaller button on the chrome dual-flush mechanism.", "task_outcome": "Partial success", "main_error": "Geometry / structure error", "secondary_error": "Task / goal error", "severity": "2 - Moderate", "affects_execution": "Possibly", "description": "The hand moves downward slightly, but the video ends before it reaches the button, and the button's appearance does not change. There is also a geometry error.", "note": "Incomplete task, likely due to a geometry/depth issue (failure to estimate distance).", "video": "videos/lvp/0013.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_014", "task": "Insert the straw into the cup", "prompt": "A person's left hand inserts a green straw into the cross-shaped opening on the lid of a clear plastic cup that is sitting on a wooden desk next to a keyboard.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0014.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_015", "task": "open_wood_door_0", "prompt": "A person's right hand pushes open the right side of a wooden gate equipped with a black metal latch.", "task_outcome": "Failure", "main_error": "Task / goal error", "secondary_error": "None", "severity": "2 - Moderate", "affects_execution": "Yes", "description": "The prompt says to push, while the video shows a pulling motion.", "note": "", "video": "videos/lvp/0015.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_016", "task": "Pickup the fork", "prompt": "A right hand reaches to pick up a silver fork that is lying on a white desk next to a grey Logitech keyboard.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0016.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_017", "task": "tear_down_the_poster", "prompt": "A right hand tears down a paper sign with a \"Berkeley Physics Lab\" logo from a glass door.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0017.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_018", "task": "open_oven", "prompt": "A person's left hand reaches toward the handle of a stainless steel oven to pull it open.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0018.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_019", "task": "Lift up the chair from the back", "prompt": "A left hand reaches for the curved backrest of a pale-green wooden chair that is sitting on a patterned rug and lifts it.", "task_outcome": "Partial success", "main_error": "Task / goal error", "secondary_error": "None", "severity": "1 - Minor", "affects_execution": "Possibly", "description": "The left hand grabs the chair, and the chair moves slightly. However, the chair spins significantly instead of being lifted.", "note": "", "video": "videos/lvp/0019.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_020", "task": "grab_scooter_by_handle_0", "prompt": "A right hand reaches to grab the right handlebar of a green and white electric scooter parked on a city sidewalk.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0020.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_021", "task": "put the fork to the red cup", "prompt": "A hand moves a silver fork toward the red cup decorated with a repeating pattern of a cartoon French bulldog.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0021.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_022", "task": "drag_out_wood_chair_0", "prompt": "A left hand pulls a light-colored wooden chair away from a dark wooden table.", "task_outcome": "Partial success", "main_error": "Task / goal error", "secondary_error": "Contact / interaction error; Geometry / structure error", "severity": "2 - Moderate", "affects_execution": "Possibly", "description": "The hand grabs and moves the chair, but it moves parallel to the table rather than away from it.", "note": "Combination of task, contact, and geometry issues; the hand remains too far from the chair to establish clear contact, likely due to poor depth estimation.", "video": "videos/lvp/0022.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_023", "task": "unplug_the_cord", "prompt": "A hand reaches toward a white power strip on a grey carpeted floor to unplug a black electrical cord.", "task_outcome": "Success", "main_error": "Contact / interaction error", "secondary_error": "None", "severity": "1 - Minor", "affects_execution": "Possibly", "description": "Before pulling, the hand's grip on the cord does not appear physically sufficient, but the task still succeeds.", "note": "", "video": "videos/lvp/0023.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_024", "task": "take_out_straw", "prompt": "A hand reaches towards a plastic cup on a white desk to pull the clear straw out of the lid.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0024.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_025", "task": "pick_towel_0", "prompt": "A right hand reaches toward a crumpled grey towel lying on a light brown wooden surface next to a white pole.", "task_outcome": "Success", "main_error": "No obvious error", "secondary_error": "None", "severity": "0 - None", "affects_execution": "No", "description": "Did exactly as the prompt", "note": "", "video": "videos/lvp/0025.mp4", "group": "clean"}, {"dataset": "LVP", "video_id": "LVP_026", "task": "lift_spoon", "prompt": "A right hand lifts a silver spoon out of a white bowl of berries and nuts resting on the canvas seat of a wooden chair.", "task_outcome": "Partial success", "main_error": "Task / goal error", "secondary_error": "Geometry / structure error", "severity": "1 - Minor", "affects_execution": "Possibly", "description": "The hand grabs and lifts the spoon, but the video ends before the spoon comes out of the bowl.", "note": "Incomplete task, possibly due to failure to predict the object's motion.", "video": "videos/lvp/0026.mp4", "group": "error"}, {"dataset": "LVP", "video_id": "LVP_027", "task": "grab_phone_0", "prompt": "A person's right hand reaches toward the black handset of a purple public payphone on a sidewalk.", "task_outcome": "Failure", "main_error": "Geometry os/robowm/0067.mp4", "group": "error"}];
let currentGroup = "error";

const grid = document.getElementById("grid");
const datasetSelect = document.getElementById("dataset");
const errorTypeSelect = document.getElementById("errorType");
const severitySelect = document.getElementById("severity");
const searchInput = document.getElementById("search");
const resultCount = document.getElementById("resultCount");
const sectionTitle = document.getElementById("sectionTitle");

function esc(x) {
  return String(x ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function badgeClass(group) {
  if (group === "error") return "error";
  if (group === "clean") return "clean";
  return "uncertain";
}

function populateErrorTypes() {
  const types = [...new Set(DATA.map(x => x.main_error).filter(Boolean))].sort();
  for (const type of types) {
    const opt = document.createElement("option");
    opt.value = type;
    opt.textContent = type;
    errorTypeSelect.appendChild(opt);
  }
}

function updateStats() {
  document.getElementById("totalStat").textContent = DATA.length;
  document.getElementById("errorStat").textContent = DATA.filter(x => x.group === "error").length;
  document.getElementById("cleanStat").textContent = DATA.filter(x => x.group === "clean").length;
  document.getElementById("uncertainStat").textContent = DATA.filter(x => x.group === "uncertain").length;
}

function card(r) {
  const secondary = r.secondary_error && r.secondary_error !== "None"
    ? `<div class="key">Secondary mistake</div><div>${esc(r.secondary_error)}</div>`
    : "";

  const note = r.note
    ? `<details><summary>Annotation note</summary><div class="details-text">${esc(r.note)}</div></details>`
    : "";

  const description = r.description
    ? `<div class="description">${esc(r.description)}</div>`
    : "";

  return `
  <article class="card">
    <div class="video-wrap">
      <video controls preload="metadata">
        <source src="${esc(r.video)}" type="video/mp4">
      </video>
    </div>
    <div class="content">
      <div class="card-title">
        <div class="video-id">${esc(r.video_id)}</div>
        <span class="badge dataset">${esc(r.dataset)}</span>
      </div>
      <div class="task">${esc(r.task)}</div>
      <div class="badges">
        <span class="badge ${badgeClass(r.group)}">${esc(r.main_error)}</span>
        <span class="badge">${esc(r.severity || "No severity")}</span>
      </div>
      <div class="meta">
        <div class="key">Task outcome</div><div>${esc(r.task_outcome || "—")}</div>
        <div class="key">Affects execution</div><div>${esc(r.affects_execution || "—")}</div>
        ${secondary}
      </div>
      ${description}
      <details>
        <summary>Generation prompt</summary>
        <div class="details-text">${esc(r.prompt || "No prompt available.")}</div>
      </details>
      ${note}
    </div>
  </article>`;
}

function render() {
  const dataset = datasetSelect.value;
  const errorType = errorTypeSelect.value;
  const severity = severitySelect.value;
  const query = searchInput.value.trim().toLowerCase();

  const rows = DATA.filter(r => {
    if (currentGroup !== "all" && r.group !== currentGroup) return false;
    if (dataset !== "all" && r.dataset !== dataset) return false;
    if (errorType !== "all" && r.main_error !== errorType) return false;
    if (severity !== "all" && r.severity !== severity) return false;

    if (query) {
      const haystack = [
        r.video_id, r.task, r.main_error, r.secondary_error, r.description, r.prompt
      ].join(" ").toLowerCase();
      if (!haystack.includes(query)) return false;
    }

    return true;
  });

  const titleMap = {
    error: "Error Cases",
    clean: "No Obvious Error",
    uncertain: "Unclear / Data Issues",
    all: "All Videos"
  };

  sectionTitle.textContent = titleMap[currentGroup];
  resultCount.textContent = `${rows.length} video${rows.length === 1 ? "" : "s"}`;

  if (!rows.length) {
    grid.innerHTML = `<div class="empty">No videos match the current filters.</div>`;
    return;
  }

  grid.innerHTML = rows.map(card).join("");
}

document.querySelectorAll("[data-group]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-group]").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    currentGroup = btn.dataset.group;
    render();
  });
});

datasetSelect.addEventListener("change", render);
errorTypeSelect.addEventListener("change", render);
severitySelect.addEventListener("change", render);
searchInput.addEventListener("input", render);

populateErrorTypes();
updateStats();
render();
</script>
</body>
</html>
